name: Sync upstream skills

on:
  schedule:
    # Run on the 1st of every month at 06:00 UTC.
    - cron: '0 6 1 * *'
  workflow_dispatch:  # Manual trigger from Actions tab.

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run explode.sh
        run: bash scripts/explode.sh

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "✓ No upstream changes — nothing to commit."
            exit 0
          fi
          git add -A
          git commit -m "chore: monthly sync from mattpocock/skills

          Auto-generated by .github/workflows/sync-upstream.yml.
          Re-explodes upstream plugin into vendor/ and refreshes marketplace.json."
          git push
